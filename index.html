<html lang="Es">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width"/>
        <title>Pokedex</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <img src="imagenes\iconos\pokeball.png" alt="Foto de Pokeball"/>
            <h1>Pokédex</h1>
        </header>
        <section id="principal">
            <input type="text" name="buscador" placeholder="Search a Pokémon..."/>
            <section id="tarjetas">
                <div class="card" id="grass">
                    <header>
                        <h2 id="nombre">Bulbasaur</h2>
                        <p id="id">#001</p>
                    </header>
                    <img class="pokemon" src="imagenes\pokemons\Bulbasaur.png" alt="Foto del pokemon 001">
                    <div class="card caracteristicas">
                        <div class="elementos">
                            <div class="elemento" id="grass">
                                <img class="icono" src="imagenes\iconos\grass.png" alt="Simbolo hierva"/>
                                <p>Grass</p>
                            </div>
                            <div class="elemento" id="poison">
                                <img class="icono" src="imagenes\iconos\poison.png" alt="Simbolo hierva"/>
                                <p>Poison</p>
                            </div>
                        </div>
                        <div class="medidas">
                            <div class="medida">
                                <img class="icono" src="imagenes\iconos\bascula.png" alt="Icono báscula"/>
                                <p id="peso">6.9 kg</p>
                            </div>
                            <div class="medida">
                                <img class="icono" src="imagenes\iconos\regla.png" alt="Icono reglas"/>
                                <p id="tamano">0.7 m</p>
                            </div>
                        </div>
                        <section id="habilidades">
                            <section id="hp">
                                <p class="caracteristica">HP</p>
                                <p class="nivel">045</p>
                                <div class="barra">
                                    <div class="relleno"></div>
                                </div>
                            </section>
                            <section id="atk">
                                <p class="caracteristica">ATK</p>
                                <p class="nivel">045</p>
                                <div class="barra">
                                    <div class="relleno"></div>
                                </div>
                            </section>
                            <section id="def">
                                <p class="caracteristica">DEF</p>
                                <p class="nivel">045</p>
                                <div class="barra">
                                    <div class="relleno"></div>
                                </div>
                            </section>
                            <section id="sat">
                                <p class="caracteristica">SAT</p>
                                <p class="nivel">045</p>
                                <div class="barra">
                                    <div class="relleno"></div>
                                </div>
                            </section>
                            <section id="sdf">
                                <p class="caracteristica">SDF</p>
                                <p class="nivel">045</p>
                                <div class="barra">
                                    <div class="relleno"></div>
                                </div>
                            </section>
                            <section id="spd">
                                <p class="caracteristica">SPD</p>
                                <p class="nivel">045</p>
                                <div class="barra">
                                    <div class="relleno"></div>
                                </div>
                            </section>
                        </section>
                    </div>
                </div>             
            </section>
        </section>
        <footer>
            ©2024 Pokémon ©1995 - 2024 Nintendo/Creatures Inc./GAME FREAK inc. TM, ®Nintendo.
        </footer>
    </body>
</html>
