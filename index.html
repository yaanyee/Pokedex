<html lang="Es">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width"/>
        <title>Pokedex</title>
        <link rel="stylesheet" href="css/style.css">
        <script src="js/pokemon.js" defer></script>
    </head>
    <body>
        <header id="main-header">
            <div id="logo">
                <img src="imagenes/iconos/pokeball.svg" alt="Poké Ball">
                <h1>Pokédex</h1>
            </div>
        </header>
        <section id="principal">
            <form id="buscador">
                <img class="icono" id="lupa" src="imagenes\iconos\lupa.svg" alt="Icono busqueda"/>
                <input type="text" name="buscador" placeholder="Search a Pokémon..." aria-label="Search a Pokemon"/>
            </form>
            <section id="tarjetas">
            </section>
        </section>
        <footer>
            ©2024 Pokémon ©1995 - 2024 Nintendo/Creatures Inc./GAME FREAK inc. TM, ®Nintendo.
        </footer>
    </body>
</html>
