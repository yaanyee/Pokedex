<html lang="Es">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width"/>
        <title>Pokedex</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <img src="imagenes\pokeball.png" alt="Foto de Pokeball"/>
            <h1>Pokédex</h1>
        </header>
        <section id="principal">
            <input type="text" name="buscador" placeholder="Search a Pokémon..."/>
            <section id="tarjetas">
                <div id="001">
                    <h2 id="nombre">Bulbasaur</h2>
                    <p id="id">#001</p>
                    <img src="imagenes\Bulbasaur.png" alt="Foto del pokemon 001">
                    <div id="type">
                        <p id="Grass">Grass</p>
                        <p id="Poison">Poison</p>
                    </div>
                </div>
            </section>
        </section>
        <footer>

        </footer>
    </body>
